name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # PATH_PREFIX is only needed because this project site has no custom
        # domain yet, so GitHub Pages serves it at /portfolio/ instead of
        # the root. Once mattpalichat.com is pointed at this Pages site,
        # delete this env block entirely (pathPrefix then defaults to "/"
        # in eleventy.config.js, same as local dev) and re-run the workflow.
        env:
          PATH_PREFIX: /portfolio/
        run: npx @11ty/eleventy

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
